name: Skill evals

# Paid: runs the real claude CLI. Manual trigger only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.312
      - name: Run skill evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python evals/run.py
      # Transcripts can be downloaded by anyone who can see the repo's Actions runs
      # (on a public repo, any signed-in user) until retention ends.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: skill-eval-runs
          retention-days: 7
          path: |
            evals/runs/
            evals/skill-results.md
